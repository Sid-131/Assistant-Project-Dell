<?xml version="1.0" encoding="UTF-8"?>
<svg class="d" viewBox="0 0 900 968" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 s1">
<title id="t1">OneFS WebUI assistant request flow</title>
<desc id="s1">A performance question is redirected to InsightIQ client-side; any other question posts to the Flask backend, which filters retrieval to OneFS documents only, embeds the query, searches ChromaDB, builds a prompt and streams a llama3.2:3b answer back to the browser.</desc>
<style>
.d{--card:#ffffff;--ink:#17212e;--muted:#5c6a7a;--line:#a8b9cc;--band:#eef3f9;--blue:#0076CE;--blueb:#e7f2fc;--wall:#c2410c;--wallb:#fdece2}
@media (prefers-color-scheme:dark){.d{--card:#161d27;--ink:#e9eef4;--muted:#98a6b6;--line:#3b4a5d;--band:#0f151d;--blue:#4aa3e8;--blueb:#122333;--wall:#f0895c;--wallb:#2a1509}}
:root[data-theme="dark"] .d{--card:#161d27;--ink:#e9eef4;--muted:#98a6b6;--line:#3b4a5d;--band:#0f151d;--blue:#4aa3e8;--blueb:#122333;--wall:#f0895c;--wallb:#2a1509}
:root[data-theme="light"] .d{--card:#ffffff;--ink:#17212e;--muted:#5c6a7a;--line:#a8b9cc;--band:#eef3f9;--blue:#0076CE;--blueb:#e7f2fc;--wall:#c2410c;--wallb:#fdece2}
.d text{font-family:ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace}
</style>
<defs><marker id="aw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>

<text x="30" y="30" font-size="18" font-weight="800" fill="var(--ink)">OneFS WebUI assistant — request flow</text>
<text x="30" y="50" font-size="12" fill="var(--muted)">index.html · walled to OneFS docs only</text>
<rect x="612" y="20" width="16" height="16" rx="3" fill="var(--wallb)" stroke="var(--wall)"/>
<text x="634" y="33" font-size="11.5" fill="var(--muted)">= OneFS-only hard wall</text>

<rect x="26" y="66" width="7" height="240" rx="3" fill="var(--line)"/>
<text x="17" y="186" font-size="11" font-weight="700" fill="var(--muted)" transform="rotate(-90 17 186)" text-anchor="middle">BROWSER</text>
<rect x="26" y="320" width="7" height="520" rx="3" fill="var(--blue)"/>
<text x="17" y="580" font-size="11" font-weight="700" fill="var(--blue)" transform="rotate(-90 17 580)" text-anchor="middle">BACKEND · Flask /api/chat</text>
<rect x="26" y="864" width="7" height="76" rx="3" fill="var(--line)"/>
<text x="17" y="902" font-size="11" font-weight="700" fill="var(--muted)" transform="rotate(-90 17 902)" text-anchor="middle">RENDER</text>

<rect x="108" y="320" width="740" height="520" rx="14" fill="var(--band)" stroke="var(--line)" stroke-dasharray="4 5" stroke-opacity=".7"/>
<text x="126" y="342" font-size="11.5" font-weight="700" fill="var(--muted)">RAG engine · nomic embeddings + ChromaDB + llama3.2:3b</text>

<g stroke="var(--line)" stroke-width="2" fill="none">
<line x1="380" y1="128" x2="380" y2="150" marker-end="url(#aw)"/>
<line x1="380" y1="216" x2="380" y2="242" marker-end="url(#aw)"/>
<line x1="620" y1="184" x2="646" y2="184" marker-end="url(#aw)"/>
<line x1="380" y1="306" x2="380" y2="356" marker-end="url(#aw)"/>
<line x1="380" y1="420" x2="380" y2="440" marker-end="url(#aw)"/>
<line x1="380" y1="500" x2="380" y2="520" marker-end="url(#aw)"/>
<line x1="380" y1="600" x2="380" y2="620" marker-end="url(#aw)"/>
<line x1="380" y1="678" x2="380" y2="698" marker-end="url(#aw)"/>
<line x1="380" y1="756" x2="380" y2="776" marker-end="url(#aw)"/>
<line x1="380" y1="838" x2="380" y2="866" marker-end="url(#aw)"/>
</g>
<text x="392" y="234" font-size="11" font-weight="700" fill="var(--muted)">no</text>
<text x="628" y="178" font-size="11" font-weight="700" fill="var(--wall)">yes</text>

<rect x="140" y="68" width="480" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="166" cy="98" r="13" fill="var(--blue)"/><text x="166" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<text x="194" y="94" font-size="14.5" font-weight="700" fill="var(--ink)">User asks in the ✨ AI Assistant panel</text>
<text x="194" y="114" font-size="11" class="mono" fill="var(--muted)">chat panel · types a question</text>

<rect x="140" y="152" width="480" height="64" rx="8" fill="var(--card)" stroke="var(--wall)" stroke-width="1.6"/>
<circle cx="166" cy="184" r="13" fill="var(--wall)"/><text x="166" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<text x="194" y="180" font-size="14.5" font-weight="700" fill="var(--ink)">Performance question?</text>
<text x="194" y="200" font-size="11" class="mono" fill="var(--muted)">isPerfQuestion(q) — PERF_RE keyword regex</text>

<rect x="648" y="150" width="230" height="80" rx="8" fill="var(--blueb)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="664" y="176" font-size="12.5" font-weight="700" fill="var(--ink)">↳ Redirect (client-side)</text>
<text x="664" y="196" font-size="10.5" fill="var(--muted)">card: “Performance lives in</text>
<text x="664" y="210" font-size="10.5" fill="var(--muted)">InsightIQ” + [Open InsightIQ →]</text>
<text x="664" y="224" font-size="10.5" font-weight="700" fill="var(--wall)">no backend call</text>

<rect x="140" y="246" width="480" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="166" cy="276" r="13" fill="var(--blue)"/><text x="166" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<text x="194" y="272" font-size="14.5" font-weight="700" fill="var(--ink)">POST /api/chat  (SSE stream)</text>
<text x="194" y="292" font-size="11" class="mono" fill="var(--muted)">{ question, context:page, product:"onefs" }</text>

<rect x="140" y="356" width="480" height="64" rx="8" fill="var(--wallb)" stroke="var(--wall)" stroke-width="1.6"/>
<circle cx="166" cy="388" r="13" fill="var(--wall)"/><text x="166" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
<text x="194" y="384" font-size="14.5" font-weight="700" fill="var(--ink)">Route by product → set the wall</text>
<text x="194" y="404" font-size="11" class="mono" fill="var(--muted)">product=onefs  ⇒  where = {"product":"onefs"}</text>

<rect x="140" y="440" width="480" height="60" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="166" cy="470" r="13" fill="var(--blue)"/><text x="166" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
<text x="194" y="466" font-size="14.5" font-weight="700" fill="var(--ink)">Embed the question</text>
<text x="194" y="486" font-size="11" class="mono" fill="var(--muted)">nomic-embed-text  →  query vector</text>

<rect x="140" y="520" width="480" height="80" rx="8" fill="var(--wallb)" stroke="var(--wall)" stroke-width="1.6"/>
<circle cx="166" cy="552" r="13" fill="var(--wall)"/><text x="166" y="556" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
<text x="194" y="548" font-size="14.5" font-weight="700" fill="var(--ink)">Vector search — ChromaDB</text>
<text x="194" y="568" font-size="11" class="mono" fill="var(--muted)">onefs_docs · top_k=5 · WHERE product=onefs</text>
<text x="194" y="586" font-size="11" font-weight="700" fill="var(--wall)">→ returns ONLY OneFS chunks · InsightIQ excluded</text>

<rect x="140" y="620" width="480" height="58" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="166" cy="649" r="13" fill="var(--blue)"/><text x="166" y="653" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text>
<text x="194" y="645" font-size="14.5" font-weight="700" fill="var(--ink)">Rank &amp; trim</text>
<text x="194" y="665" font-size="11" class="mono" fill="var(--muted)">cosine sim · cite ≥0.35 · excerpts → 1300 chars</text>

<rect x="140" y="698" width="480" height="58" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="166" cy="727" r="13" fill="var(--blue)"/><text x="166" y="731" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text>
<text x="194" y="723" font-size="14.5" font-weight="700" fill="var(--ink)">Build the prompt</text>
<text x="194" y="743" font-size="11" class="mono" fill="var(--muted)">SYSTEM_PROMPT + OneFS excerpts + question</text>

<rect x="140" y="776" width="480" height="62" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="166" cy="807" r="13" fill="var(--blue)"/><text x="166" y="811" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9</text>
<text x="194" y="803" font-size="14.5" font-weight="700" fill="var(--ink)">Generate — llama3.2:3b</text>
<text x="194" y="823" font-size="11" class="mono" fill="var(--muted)">stream tokens (SSE) · hide cites if “insufficient info”</text>

<rect x="140" y="866" width="480" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="166" cy="901" r="13" fill="var(--blue)"/><text x="166" y="905" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">10</text>
<text x="194" y="894" font-size="14.5" font-weight="700" fill="var(--ink)">Render in the panel</text>
<text x="194" y="913" font-size="11" class="mono" fill="var(--muted)">copyable isi CLI · click-to-navigate links</text>
<text x="194" y="928" font-size="11" class="mono" fill="var(--muted)">📄 citations: OneFS guides only</text>
</svg>
